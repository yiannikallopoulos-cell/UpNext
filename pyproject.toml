[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upnext"
version = "0.1.0"
description = "Automated TikTok creator scouting for emerging talent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Yianni Kallopoulos" }
]
license = { text = "MIT" }

dependencies = [
    # Database
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",

    # External APIs
    "apify-client>=1.8",
    "anthropic>=0.40",
    "httpx>=0.27",

    # Configuration
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # Utilities
    "structlog>=24.4",
    "tenacity>=9.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-psycopg2",
]

[project.scripts]
upnext = "scout.jobs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
